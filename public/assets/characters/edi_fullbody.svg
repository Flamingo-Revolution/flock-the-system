  <!-- brows -->
  <path d="M418 300 C445 281 477 281 497 295" fill="none" stroke="#3B312D" stroke-width="17" stroke-linecap="round"/>
  <path d="M535 294 C557 281 590 282 613 300" fill="none" stroke="#3B312D" stroke-width="17" stroke-linecap="round"/>

  <!-- eyes -->
  <path d="M417 324 C442 310 472 311 494 325 C473 342 441 343 417 324 Z" fill="#F3E8DC" stroke="#704535" stroke-width="5"/>
  <path d="M536 324 C559 311 590 310 614 324 C590 343 558 342 536 324 Z" fill="#F3E8DC" stroke="#704535" stroke-width="5"/>
  <circle cx="457" cy="326" r="11" fill="#6A6040"/>
  <circle cx="574" cy="326" r="11" fill="#6A6040"/>
  <circle cx="457" cy="326" r="5" fill="#151515"/>
  <circle cx="574" cy="326" r="5" fill="#151515"/>

  <!-- nose -->
  <path d="M510 320 C498 352 490 374 501 393 C514 399 531 397 541 388" fill="none" stroke="#9B6248" stroke-width="8" stroke-linecap="round"/>

  <!-- beard base -->
  <path d="M394 371
