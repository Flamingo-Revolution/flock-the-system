<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B07D"/>
      <stop offset="1" stop-color="#C98A5F"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202226"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181C"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8DCE2"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202227"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- transparent background -->

  <!-- ground shadow -->
  <ellipse cx="517" cy="1456" rx="286" ry="34" fill="#000" opacity=".18" filter="url(#softShadow)"/>

  <!-- back leg -->
  <path d="M553 947 L686 944 L724 1328 L653 1364 L568 1058 Z" fill="url(#pants)" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
  <!-- front leg -->
  <path d="M391 944 L553 944 L526 1340 L447 1368 L365 1098 Z" fill="url(#pants)" stroke="#000" stroke-width="12" stroke-linejoin="round"/>

  <!-- shoes -->
  <path d="M418 1323 C443 1311 488 1307 527 1337 L518 1412 C451 1432 332 1433 286 1400 C305 1361 354 1340 418 1323 Z" fill="url(#shoe)" stroke="#000" stroke-width="12"/>
  <path d="M653 1330 C693 1324 724 1332 752 1360 C779 1386 784 1416 752 1435 C705 1447 639 1435 602 1406 L607 1348 Z" fill="url(#shoe)" stroke="#000" stroke-width="12"/>
  <path d="M316 1396 C369 1411 444 1412 510 1396" fill="none" stroke="#4C4F55" stroke-width="7" opacity=".7"/>
  <path d="M624 1400 C670 1418 716 1419 755 1408" fill="none" stroke="#4C4F55" stroke-width="7" opacity=".7"/>

  <!-- torso / jacket -->
  <path d="M285 582
           C320 527 392 506 449 494
           L571 494
           C640 507 713 533 745 587
           C776 639 780 774 764 935
           C714 963 648 980 582 983
           L455 983
           C387 980 320 964 270 935
           C255 790 255 638 285 582 Z"
        fill="url(#jacket)" stroke="#000" stroke-width="14" stroke-linejoin="round"/>

  <!-- shirt -->
  <path d="M437 503 L508 493 L579 505
           L622 596 L587 939
           L449 939 L400 594 Z"
        fill="url(#shirt)" stroke="#C3C7CD" stroke-width="7" stroke-linejoin="round"/>

  <!-- open collar -->
  <path d="M437 504 L480 555 L514 624 L400 589 Z" fill="#F6F6F6" stroke="#AEB3BB" stroke-width="6"/>
  <path d="M579 505 L544 555 L514 624 L622 592 Z" fill="#F8F8F8" stroke="#AEB3BB" stroke-width="6"/>
  <path d="M514 624 L527 888" stroke="#B8BDC5" stroke-width="6"/>

  <!-- shirt buttons -->
  <circle cx="524" cy="687" r="7" fill="#D7D4C9"/>
  <circle cx="527" cy="758" r="7" fill="#D7D4C9"/>
  <circle cx="530" cy="829" r="7" fill="#D7D4C9"/>

  <!-- jacket lapels -->
  <path d="M399 528 L335 606 L413 718 L470 642 Z" fill="#15171B" stroke="#030405" stroke-width="8"/>
  <path d="M584 526 L678 603 L611 715 L552 640 Z" fill="#15171B" stroke="#030405" stroke-width="8"/>

  <!-- left arm -->
  <path d="M306 585 C250 614 225 690 229 812 C232 891 265 956 314 988
