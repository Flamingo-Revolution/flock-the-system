  <!-- mouth -->
  <path d="M478 413 C499 422 530 423 552 413" fill="none" stroke="#6B3F36" stroke-width="7" stroke-linecap="round"/>

  <!-- forehead / cheek detail -->
  <path d="M432 244 C457 236 483 238 499 245" fill="none" stroke="#AF7657" stroke-width="4" opacity=".6"/>
  <path d="M529 245 C551 236 579 238 597 246" fill="none" stroke="#AF7657" stroke-width="4" opacity=".6"/>
  <path d="M424 357 C446 370 468 371 489 360" fill="none" stroke="#B0785B" stroke-width="4" opacity=".5"/>
  <path d="M539 360 C559 371 584 370 606 357" fill="none" stroke="#B0785B" stroke-width="4" opacity=".5"/>

  <!-- lapel pin -->
  <g transform="translate(621 618) rotate(12)">
    <rect x="0" y="0" width="15" height="55" rx="3" fill="#ED1B24"/>
    <rect x="2" y="20" width="11" height="9" fill="#111"/>
  </g>

  <!-- game-character highlight -->
  <path d="M286 608 C328 550 385 530 433 518" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".10"/>
  <path d="M659 545 C720 578 747 646 748 714" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".08"/>
</svg>
