  <!-- belt -->
  <rect x="401" y="935" width="229" height="30" rx="10" fill="#181A1E" stroke="#020203" stroke-width="7"/>
  <rect x="493" y="929" width="48" height="42" rx="6" fill="#3A3030" stroke="#0A0A0A" stroke-width="7"/>

  <!-- neck -->
  <path d="M443 427 L579 427 L571 518 C553 552 477 553 453 516 Z" fill="url(#skin)" stroke="#7E4A35" stroke-width="8"/>

  <!-- ears -->
  <ellipse cx="366" cy="339" rx="40" ry="61" fill="url(#skin)" stroke="#7E4A35" stroke-width="8"/>
  <ellipse cx="657" cy="339" rx="40" ry="61" fill="url(#skin)" stroke="#7E4A35" stroke-width="8"/>

